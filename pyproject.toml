[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "retailrank"
version = "1.0.0"
description = "Two-stage product recommendation with chronological evaluation"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "implicit", "lightgbm", "fastapi", "uvicorn", "joblib"]
[tool.setuptools.packages.find]
where = ["src"]
